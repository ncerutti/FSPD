[project]
name = "LivingFSPD"
version = "0.0.1"
description = "A living food systems policy database"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Nicola Cerutti", email = "nc@nicores.de" }
]

dependencies = [
    "pandas",
    "pyarrow",
    "numpy",
    "ruff>=0.14.10",
    "black>=25.12.0",
    "ipykernel>=7.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
